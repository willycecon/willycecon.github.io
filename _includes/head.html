<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% if page.title and page.title != "Home" %}{{ page.title }} | {% endif %}{{ site.title }}</title>

      crossorigin="anonymous">

<!-- Custom styles -->
